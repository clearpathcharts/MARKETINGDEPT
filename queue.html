<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue — ClearPath Automation Console</title>
<link rel="stylesheet" href="styles.css">
<script src="auth.js"></script>
<script>cpacGuardPage();</script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="side-logo">
      <div class="logo-mark">CP</div>
      <div class="logo-text">Automation Console<span>Local build</span></div>
    </div>
    <ul class="side-nav">
      <li><a href="dashboard.html"><span class="nav-dot"></span>Dashboard</a></li>
